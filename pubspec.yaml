name: fire_safety_console
description: A complete Flutter Fire Safety Monitoring Console with GetX and MVMS architecture.
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management & Navigation
  get: ^4.6.6
  get_storage: ^2.1.1

  # Networking
  dio: ^5.7.0
  web_socket_channel: ^2.4.0
  connectivity_plus: ^5.0.0

  # JSON Serialization
  json_annotation: ^4.9.0
  equatable: ^2.0.5

  # Internationalization
  intl: ^0.19.0

  # Charts & UI
  fl_chart: ^0.66.2

  # Firebase
  firebase_core: ^2.24.2
  firebase_auth: ^4.10.1
  cloud_firestore: ^4.13.6
  firebase_storage: ^11.5.6
  firebase_messaging: ^14.6.8

  # Local Database
  sqflite: ^2.3.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Notifications
  flutter_local_notifications: ^16.2.0

  # Device Info
  device_info_plus: ^9.1.1
  package_info_plus: ^5.0.1

  # Misc
  cupertino_icons: ^1.0.2
  timeago: ^3.5.0
  shimmer: ^3.0.0
  uuid: ^4.0.0
  image_picker: ^1.0.4

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0
  build_runner: ^2.4.11
  json_serializable: ^6.9.0
  mockito: ^5.4.4
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 500
